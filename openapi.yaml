openapi: 3.0.0

info:
  title: Books Management API
  description: |
    A RESTful API for managing books using Node.js, Express, and MongoDB.
    Supports full CRUD operations along with search, filtering, sorting, and pagination.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/books:
    get:
      summary: Get all books with search, filters, sorting, and pagination
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search text in book name and description
        - in: query
          name: author
          schema:
            type: string
          description: Filter books by author (case-insensitive)
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: Filter books published from this date (inclusive)
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: Filter books published until this date (inclusive)
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [name, author, publishDate]
          description: Field to sort by
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
          description: Sort order
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 50
          description: Number of records per page
      responses:
        "200":
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"

    post:
      summary: Create a new book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookInput"
      responses:
        "201":
          description: Book created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"

  /api/books/{id}:
    patch:
      summary: Update an existing book
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Book ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookInput"
      responses:
        "200":
          description: Book updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          description: Book not found

    delete:
      summary: Delete a book
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Book ID
      responses:
        "204":
          description: Book deleted successfully
        "404":
          description: Book not found

components:
  schemas:
    Book:
      type: object
      properties:
        _id:
          type: string
          example: 65b8f5d3e9b7c91d3a6c1e21
        name:
          type: string
          example: Clean Code Explained
        description:
          type: string
          example: A detailed guide to writing clean and maintainable code.
        author:
          type: string
          example: Robert C. Martin
        publishDate:
          type: string
          format: date-time
          example: 2008-08-01T00:00:00.000Z
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BookInput:
      type: object
      required:
        - name
        - description
        - author
      properties:
        name:
          type: string
        description:
          type: string
          maxLength: 2000
        author:
          type: string
        publishDate:
          type: string
          format: date
